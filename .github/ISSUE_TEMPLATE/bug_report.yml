name: Bug report
description: Something in AutoVocaIndex isn't working the way the docs describe.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. AutoVocaIndex is updated in periodic batches, so a reply isn't guaranteed, but reproducible reports are read and fixes ship in a later update.

        Setup and usage questions belong in [Discussions](https://github.com/AlmostAnOptimist/AutoVocaIndex/discussions) instead.
  - type: dropdown
    id: where
    attributes:
      label: Where did this happen?
      options:
        - The hosted demo
        - My own self-hosted copy
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Self-hosted copies only. The version in package.json, or the commit you deployed.
      placeholder: "1.1.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include any error message shown on screen or in the browser console.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. iPhone 15 with Safari, or Windows 11 with Chrome"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or screen recordings are welcome.
